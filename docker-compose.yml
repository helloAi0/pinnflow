version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    # FIX: Mount the whole app directory rather than a specific missing file 
    # to prevent Docker from creating fake directories on your host machine.
    volumes:
      - .:/app
    
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
