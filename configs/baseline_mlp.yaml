# Baseline 1: Data-Only MLP (No physical loss penalties)
experiment_name: "baseline_mlp"
model:
  architecture: "standard_mlp"
  in_dim: 3
  out_dim: 3
  hidden_layers: 6
  hidden_dim: 128
  activation: "tanh"

training:
  budget: 5000
  noise_level: 0.0
  split_protocol: "random"
  val_ratio: 0.1
  test_ratio: 0.2
  collocation_points: 0
  adam_epochs: 1000
  lbfgs_epochs: 20
  learning_rate: 0.001
  batch_size: 5000
  seed: 42
  device: "auto"

loss:
  strategy: "static"
  weight_data: 1.0
  weight_pde: 0.0
  weight_bc: 0.0
  weight_gauge: 0.0

output:
  output_dir: "results/baseline_mlp"
