name: PINNFlow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Create Dummy Artifacts for CI
      run: |
        touch final_pinn_model.pth
        mkdir -p datasets

    # FIX: References the correct filename targets matching the root repository footprint
    - name: Build API Container
      run: docker build -t pinnflow-api -f Dockerfile.api .

    # FIX: References the correct filename targets matching the root repository footprint
    - name: Build UI Container
      run: docker build -t pinnflow-ui -f Dockerfile.ui .
