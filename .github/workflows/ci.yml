name: PINNFlow Rigorous CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scientific-python-tests:
    name: Scientific Python & Analytical Physics Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "numpy<2" onnx onnxruntime onnxscript
          pip install -e .

      - name: Fetch reference CFD dataset
        run: python scripts/download_data.py

      - name: Run Pytest Suite (Scientific, Unit, Integration, API, Parity)
        run: |
          python -m pytest tests/ -v

      - name: Execute End-to-End Scientific Smoke Test
        run: |
          python scripts/smoke_test.py

  frontend-validation:
    name: React Scientific Instrument UI Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Build React Production Bundle
        run: |
          cd frontend
          npm run build

  container-builds:
    name: Production Docker Builds & Container Smoke Test
    runs-on: ubuntu-latest
    needs: [scientific-python-tests, frontend-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API Container
        run: |
          docker build -t pinnflow-api -f Dockerfile.api .

      - name: Build UI Container
        run: |
          docker build -t pinnflow-ui -f Dockerfile.ui .
