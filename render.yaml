services:
  - type: web
    name: pinnflow-api
    env: python
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: CORS_ORIGINS
        value: "*"
      - key: PINNFLOW_CHECKPOINT
        value: "final_pinn_model.pth"
    healthCheckPath: /api/v1/health
    autoDeploy: true

  - type: web
    name: pinnflow-frontend
    env: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://pinnflow-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
